{% extends "base.html" %}
{% block titulo %}Criar conta · Help Desk{% endblock %}
{% block conteudo %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3 text-center">Criar conta</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% for campo in form %}
      <div class="mb-3">
        <label class="form-label" for="{{ campo.id_for_label }}">{{ campo.label }}</label>
        {{ campo }}
        {% for e in campo.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
      </div>
      {% endfor %}
      <button class="btn btn-primary w-100">Cadastrar</button>
    </form>
    <p class="text-center mt-3 mb-0 small">Já tem conta? <a href="{% url 'login' %}">Entrar</a></p>
  </div></div>
</div></div>
{% endblock %}
