{% extends "base.html" %}
{% block titulo %}Entrar · Help Desk{% endblock %}
{% block conteudo %}
<div class="row justify-content-center"><div class="col-md-5 col-lg-4">
  <div class="card shadow-sm"><div class="card-body p-4">
    <h1 class="h4 mb-3 text-center">Entrar no Help Desk</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors.0 }}</div>{% endif %}
      <div class="mb-3"><label class="form-label" for="{{ form.username.id_for_label }}">E-mail</label>{{ form.username }}</div>
      <div class="mb-3"><label class="form-label" for="{{ form.password.id_for_label }}">Senha</label>{{ form.password }}</div>
      <input type="hidden" name="next" value="{{ request.GET.next }}">
      <button class="btn btn-primary w-100">Entrar</button>
    </form>
    <p class="text-center mt-3 mb-0 small">Não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
  </div></div>
</div></div>
{% endblock %}
